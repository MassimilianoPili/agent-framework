name: CI — Build & Test

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Test (all modules)
        run: mvn clean verify -B -T 1C -ntp
        # -B batch mode, -T 1C one thread per core, -ntp no transfer progress

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  # Validate Flyway migrations against a real PostgreSQL with pgvector + AGE
  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: []  # runs in parallel with build

    services:
      postgres:
        image: ${{ secrets.REGISTRY_URL }}/sol/postgres:pg18-age
        env:
          POSTGRES_DB: agentframework_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d agentframework_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run Flyway migrations
        run: |
          mvn -B -ntp flyway:migrate \
            -pl control-plane/orchestrator \
            -Dflyway.url=jdbc:postgresql://localhost:5432/agentframework_ci \
            -Dflyway.user=ci \
            -Dflyway.password=ci \
            -Dflyway.locations=classpath:db/migration

      - name: Verify migration count
        run: |
          EXPECTED=36
          ACTUAL=$(PGPASSWORD=ci psql -h localhost -U ci -d agentframework_ci -t -c \
            "SELECT count(*) FROM flyway_schema_history WHERE success = true;")
          ACTUAL=$(echo "$ACTUAL" | xargs)  # trim whitespace
          echo "Migrations applied: $ACTUAL / $EXPECTED expected"
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "::error::Migration count mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
